name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build Release Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux-gnu
            artifact: x86_64-linux

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Zig
      uses: mlugg/setup-zig@v2
      with:
        version: 0.17.0-dev.56+a8226cd53

    - name: Build release binary
      run: |
        cd packages/zig
        zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}

    - name: Package binary
      run: |
        mkdir -p release
        find packages/zig/zig-out/bin -name 'mail*' -type f -executable | head -1 | xargs -I {} cp {} release/mail-${{ matrix.artifact }}
        tar -czf mail-${{ matrix.artifact }}.tar.gz -C release mail-${{ matrix.artifact }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mail-${{ matrix.artifact }}
        path: mail-${{ matrix.artifact }}.tar.gz

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/mail:latest
          ${{ secrets.DOCKER_USERNAME }}/mail:${{ steps.version.outputs.VERSION }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Create release with Pantry
      uses: home-lang/pantry/packages/action@main
      with:
        install: 'false'
        release: 'true'
        release-files: |
          mail-*/mail-*.tar.gz
        release-tag: ${{ github.ref_name }}
        release-token: ${{ secrets.GITHUB_TOKEN }}
        release-changelog: .github/release-notes.md
        release-notes: |
          ## Release Info
          - Version: ${{ github.ref_name }}

          ## Installation

          Download the appropriate binary for your platform from the assets below.

          This release was created using the Pantry GitHub Action.
