name: Publish Mail SDK staging prerelease

on:
  push:
    tags: ['mail-sdk-staging-0.3.27-staging.1-r4']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_REVISION: fe645c3cbeaba47a49fe0d8c2eb166aa767bd31f
      PACKAGE_VERSION: 0.3.27-staging.1
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify the staging tag and exact PR source
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/tags/mail-sdk-staging-$PACKAGE_VERSION-r4"
          git merge-base --is-ancestor "$SOURCE_REVISION" HEAD
          test "$(git diff --name-only "$SOURCE_REVISION" HEAD)" = ".github/workflows/release.yml"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pinned workspace dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build and test the SDK
        working-directory: packages/ts
        run: |
          bun test test/provisioning.test.ts
          bun run build:sdk
          npm pkg set "version=$PACKAGE_VERSION" publishConfig.tag=staging
          bun - <<'JS'
          import { createMailProvisioningClient } from './dist/index.js';
          const client = createMailProvisioningClient({ baseUrl: 'http://127.0.0.1:8099', token: 'a'.repeat(64) });
          for (const field of ['status', 'mailbox', 'apply', 'webmailSignInWithPassword']) {
            if (typeof client[field] !== 'function') throw new Error('Missing SDK export: ' + field);
          }
          JS

      - name: Verify the four native binaries built from the PR revision
        env:
          NATIVE_ARCHIVE_URL: ${{ secrets.MAIL_STAGING_PR96_NATIVE_ARTIFACT_URL }}
        shell: bash
        run: |
          archive="$RUNNER_TEMP/mail-pr96-native.tar.gz"
          curl --fail --silent --show-error --max-time 120 "$NATIVE_ARCHIVE_URL" -o "$archive"
          printf '%s  %s\n' d4490620c5d54cf7aea53d74706fe37d3a0f5b379a0607ecdb2f7683bf436305 "$archive" | sha256sum -c -
          tar -xzf "$archive" -C packages/ts
          for target in x86_64-linux aarch64-linux x86_64-macos aarch64-macos; do
            test -x "packages/ts/bin/mail-$target"
          done

      - name: Publish only to the staging dist-tag
        working-directory: packages/ts
        shell: bash
        run: |
          test "$(npm view @stacksjs/mail@latest version --registry https://registry.npmjs.org)" = "0.3.26"
          npm pack --dry-run --ignore-scripts
          npm publish --access public --tag staging --provenance --ignore-scripts --registry https://registry.npmjs.org
          test "$(npm view @stacksjs/mail@latest version --registry https://registry.npmjs.org)" = "0.3.26"
