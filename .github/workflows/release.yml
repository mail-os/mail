name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    # All targets cross-compile from ONE cheap Linux box: build.zig vendors sqlite3.c
    # and only links libc when cross-compiling (no system/framework deps), so zig
    # produces every platform's binary without macOS/ARM runners.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-gnu
            artifact: x86_64-linux
          - target: aarch64-linux-gnu
            artifact: aarch64-linux
          - target: x86_64-macos
            artifact: x86_64-macos
          - target: aarch64-macos
            artifact: aarch64-macos

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Zig
      uses: mlugg/setup-zig@v2
      with:
        version: 0.17.0-dev.56+a8226cd53

    - name: Build release binary
      run: |
        cd packages/zig
        zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}

    - name: Package binary
      run: |
        mkdir -p release
        # Single -Dtarget build installs the exe as zig-out/bin/mail (or mail-*).
        bin=$(find packages/zig/zig-out/bin -type f -name 'mail*' ! -name '*.tar.gz' | head -1)
        test -n "$bin" || { echo "no mail binary produced for ${{ matrix.target }}"; exit 1; }
        cp "$bin" "release/mail-${{ matrix.artifact }}"
        tar -czf mail-${{ matrix.artifact }}.tar.gz -C release mail-${{ matrix.artifact }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mail-${{ matrix.artifact }}
        path: mail-${{ matrix.artifact }}.tar.gz

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Create release with Pantry
      uses: home-lang/pantry/packages/action@main
      with:
        install: 'false'
        release: 'true'
        release-files: |
          mail-*/mail-*.tar.gz
        release-tag: ${{ github.ref_name }}
        release-token: ${{ secrets.GITHUB_TOKEN }}
        release-changelog: .github/release-notes.md
        release-notes: |
          ## Release Info
          - Version: ${{ github.ref_name }}

          ## Installation

          Download the appropriate binary for your platform from the assets below.

          This release was created using the Pantry GitHub Action.
