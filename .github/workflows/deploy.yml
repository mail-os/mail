name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'packages/zig/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy (Hetzner)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Setup project dependencies with Pantry
      uses: pantry-pm/pantry/packages/action@v0.11.28

    - name: Build for Linux x86_64
      working-directory: packages/zig
      run: zig build -Dtarget=x86_64-linux-gnu -Doptimize=ReleaseFast

    - name: Deploy to Hetzner
      env:
        SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        HOST: ${{ secrets.HETZNER_HOST }}
      run: |
        set -euo pipefail
        mkdir -p ~/.ssh
        printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

        # ship the freshly built binary
        scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
          packages/zig/zig-out/bin/mail "root@$HOST:/tmp/mail-new"

        # swap + restart with an ELF sanity check and rollback on failure
        ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new "root@$HOST" '
          set -e
          test "$(head -c4 /tmp/mail-new | od -An -tx1 | tr -d " ")" = "7f454c46" || { echo "not an ELF binary"; exit 1; }
          systemctl stop mail || true
          cp -f /opt/mail/mail-server /opt/mail/mail-server.bak
          mv /tmp/mail-new /opt/mail/mail-server
          chmod +x /opt/mail/mail-server
          chown mail-server:mail-server /opt/mail/mail-server
          systemctl start mail
          sleep 3
          active=$(systemctl is-active mail)
          echo "mail service: $active"
          if [ "$active" != "active" ]; then
            echo "restart failed; rolling back"
            cp -f /opt/mail/mail-server.bak /opt/mail/mail-server
            systemctl restart mail
            exit 1
          fi
        '
        echo "Deployed to Hetzner ($HOST)."

    - name: Verify public mail protocols
      env:
        HOST: ${{ secrets.HETZNER_HOST }}
      run: |
        set -euo pipefail
        # Run from the GitHub runner, outside Hetzner. A local listener check
        # cannot detect a cloud firewall that dropped the mail ports.
        for port in 25 143 465 587 993; do
          timeout 10 bash -c "exec 3<>/dev/tcp/$HOST/$port"
          echo "public tcp/$port reachable"
        done
        # Prove the implicit-TLS endpoints complete a real handshake and serve
        # the certificate for mail.stacksjs.com, not merely accept a socket.
        timeout 15 openssl s_client -connect "$HOST:993" -servername mail.stacksjs.com \
          -verify_hostname mail.stacksjs.com -verify_return_error </dev/null 2>/dev/null \
          | openssl x509 -noout -checkend 86400
        timeout 15 openssl s_client -connect "$HOST:465" -servername mail.stacksjs.com \
          -verify_hostname mail.stacksjs.com -verify_return_error </dev/null 2>/dev/null \
          | openssl x509 -noout -checkend 86400
