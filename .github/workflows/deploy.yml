name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'packages/zig/**'
      - 'packages/devtools/**'

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Zig
      uses: mlugg/setup-zig@v2
      with:
        version: 0.17.0-dev.56+a8226cd53

    - name: Install SQLite
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev

    - name: Build for Linux x86_64
      working-directory: packages/zig
      run: zig build -Dtarget=x86_64-linux-gnu -Doptimize=ReleaseFast

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Upload binary to S3
      run: aws s3 cp packages/zig/zig-out/bin/mail s3://stacks-production-s3-email/deploy/mail-server

    - name: Deploy to server
      run: |
        COMMAND_ID=$(aws ssm send-command \
          --instance-ids ${{ secrets.INSTANCE_ID }} \
          --document-name AWS-RunShellScript \
          --parameters '{"commands":["aws s3 cp s3://stacks-production-s3-email/deploy/mail-server /opt/mail/mail-server-new","chmod +x /opt/mail/mail-server-new","systemctl stop mail","mv /opt/mail/mail-server /opt/mail/mail-server-old","mv /opt/mail/mail-server-new /opt/mail/mail-server","systemctl start mail","sleep 2","systemctl is-active mail"]}' \
          --output text --query 'Command.CommandId')

        echo "Command ID: $COMMAND_ID"

        for i in $(seq 1 20); do
          sleep 5
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id ${{ secrets.INSTANCE_ID }} \
            --query 'Status' --output text 2>/dev/null || echo "Pending")

          echo "Attempt $i: $STATUS"

          if [ "$STATUS" = "Success" ]; then
            echo "Deployment successful!"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id ${{ secrets.INSTANCE_ID }} \
              --query 'StandardOutputContent' --output text
            exit 0
          elif [ "$STATUS" = "Failed" ]; then
            echo "Deployment failed!"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id ${{ secrets.INSTANCE_ID }} \
              --query 'StandardErrorContent' --output text
            exit 1
          fi
        done

        echo "Deployment timed out"
        exit 1

    - name: Deploy dashboard
      run: |
        # Upload dashboard files to S3
        aws s3 cp packages/devtools/server.ts s3://stacks-production-s3-email/deploy/dashboard/server.ts
        aws s3 cp packages/devtools/pages/home.stx s3://stacks-production-s3-email/deploy/dashboard/pages/home.stx

        COMMAND_ID=$(aws ssm send-command \
          --instance-ids ${{ secrets.INSTANCE_ID }} \
          --document-name AWS-RunShellScript \
          --parameters '{"commands":["mkdir -p /opt/mail/dashboard/pages","aws s3 cp s3://stacks-production-s3-email/deploy/dashboard/server.ts /opt/mail/dashboard/server.ts","aws s3 cp s3://stacks-production-s3-email/deploy/dashboard/pages/home.stx /opt/mail/dashboard/pages/home.stx","systemctl restart mail-dashboard","sleep 2","systemctl is-active mail-dashboard"]}' \
          --output text --query 'Command.CommandId')

        for i in $(seq 1 10); do
          sleep 3
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id ${{ secrets.INSTANCE_ID }} \
            --query 'Status' --output text 2>/dev/null || echo "Pending")

          if [ "$STATUS" = "Success" ]; then
            echo "Dashboard deployed successfully!"
            exit 0
          elif [ "$STATUS" = "Failed" ]; then
            echo "Dashboard deployment failed!"
            exit 1
          fi
        done
