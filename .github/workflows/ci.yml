name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: packages/zig

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Setup project dependencies with Pantry
      uses: pantry-pm/pantry/packages/action@v0.11.28

    - name: Build
      run: zig build -Doptimize=ReleaseSafe

    - name: Run tests
      run: zig build test

    - name: Check formatting
      run: zig fmt --check src/

  sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup project dependencies with Pantry
      uses: pantry-pm/pantry/packages/action@v0.11.28

    - name: Install workspace dependencies
      run: bun install --frozen-lockfile

    # Covers the MIME parser: its own behaviour suite plus the parity suites that
    # compare it against postal-mime on well formed, malformed and mutated messages.
    - name: Run SDK tests
      working-directory: packages/ts
      run: bun test

    - name: Lint
      run: bunx --bun pickier packages/ts

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup project dependencies with Pantry
      uses: pantry-pm/pantry/packages/action@v0.11.28

    - name: Install workspace dependencies
      run: bun install --frozen-lockfile

    # The Docker context is packages/zig only and webmail_dist is gitignored,
    # so render the webmail bundle on the runner first; the image build then
    # embeds the pre-rendered dist (no bun inside the image).
    - name: Build webmail bundle
      working-directory: packages/webmail
      run: bun run build

    # The image installs Zig itself, and its build context is packages/zig only,
    # so the Dockerfile cannot read pantry.jsonc and carries its own copy of the
    # pin. That copy went stale unnoticed — every other job moved to
    # 0.17.0-dev.2033 while the image kept asking ziglang.org for a build it had
    # already garbage-collected, and the only symptom was a 404 deep in a log.
    # Compare them here so a repin that misses the Dockerfile fails on the
    # mismatch rather than on whatever breaks weeks later.
    - name: Check the Dockerfile's Zig pin matches pantry.jsonc
      run: |
        set -euo pipefail
        pinned=$(grep -oE '"ziglang\.org"[[:space:]]*:[[:space:]]*"[^"]+"' pantry.jsonc \
          | head -1 | sed -E 's/.*:[[:space:]]*"([^"]+)"/\1/')
        dockerfile=$(grep -oE '^ARG ZIG_VERSION=.*' packages/zig/Dockerfile \
          | head -1 | cut -d= -f2-)
        if [ -z "$pinned" ] || [ -z "$dockerfile" ]; then
          echo "::error::could not read the Zig pin (pantry.jsonc='$pinned', Dockerfile='$dockerfile')"
          exit 1
        fi
        if [ "$pinned" != "$dockerfile" ]; then
          echo "::error::Zig pin drift: pantry.jsonc says '$pinned', packages/zig/Dockerfile says '$dockerfile'."
          echo "::error::Update ARG ZIG_VERSION and ARG ZIG_SHA256 in packages/zig/Dockerfile to match."
          exit 1
        fi
        echo "Zig pin matches on both sides: $pinned"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./packages/zig
        push: false
        tags: mail:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/zig

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup project dependencies with Pantry
      uses: pantry-pm/pantry/packages/action@v0.11.28

    - name: Check formatting
      run: zig fmt --check src/

    - name: Install workspace dependencies
      working-directory: ${{ github.workspace }}
      run: bun install --frozen-lockfile

    # Guards the release flow: the preflight suite asserts every manifest bumpx
    # rewrites is still on the same version, so drift fails a PR instead of
    # silently shipping a stale package at release time.
    - name: Test release scripts
      working-directory: ${{ github.workspace }}
      run: bun test scripts

    - name: Static analysis (future)
      run: echo "Static analysis placeholder"

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/zig

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Setup project dependencies with Pantry
      uses: pantry-pm/pantry/packages/action@v0.11.28

    - name: Install coverage dependencies
      working-directory: ${{ github.workspace }}
      run: |
        sudo apt-get update
        sudo apt-get install -y binutils-dev libdw-dev

    - name: Install kcov from source
      working-directory: ${{ github.workspace }}
      run: |
        KCOV_VERSION=42
        wget -q https://github.com/SimonKagstrom/kcov/releases/download/v${KCOV_VERSION}/kcov-amd64.tar.gz
        tar xzf kcov-amd64.tar.gz
        sudo cp usr/local/bin/kcov /usr/local/bin/
        rm -rf usr kcov-amd64.tar.gz

    - name: Build with debug info
      run: zig build -Doptimize=Debug

    - name: Run tests with coverage
      run: |
        mkdir -p coverage
        kcov --include-pattern=src/ coverage/ zig build test 2>/dev/null || true

    - name: Generate coverage report
      run: |
        if [ -d "coverage" ]; then
          echo "Coverage report generated"
          ls -la coverage/
        fi

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        directory: ./packages/zig/coverage
        fail_ci_if_error: false
        verbose: true

  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: packages/zig

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Setup project dependencies with Pantry
      uses: pantry-pm/pantry/packages/action@v0.11.28

    - name: Build release
      run: zig build -Doptimize=ReleaseFast

    - name: Run benchmarks
      run: |
        if [ -f "zig-out/bin/benchmark" ]; then
          ./zig-out/bin/benchmark --json > benchmark-results.json
        else
          echo '{"note": "benchmark binary not found"}' > benchmark-results.json
        fi

    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: packages/zig/benchmark-results.json
