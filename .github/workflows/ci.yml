name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: packages/zig

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Setup Zig
      uses: mlugg/setup-zig@v2
      with:
        version: 0.16.0

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2

    - name: Setup Pantry
      uses: home-lang/pantry/packages/action@main

    - name: Install SQLite (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev

    - name: Install SQLite (macOS)
      if: matrix.os == 'macos-latest'
      run: brew install sqlite

    - name: Build
      run: zig build -Doptimize=ReleaseSafe

    - name: Run tests
      run: zig build test

    - name: Check formatting
      run: zig fmt --check src/

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Pantry
      uses: home-lang/pantry/packages/action@main

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2

    # The Docker context is packages/zig only and webmail_dist is gitignored,
    # so render the webmail bundle on the runner first; the image build then
    # embeds the pre-rendered dist (no bun inside the image).
    - name: Build webmail bundle
      working-directory: packages/webmail
      run: bun run build

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./packages/zig
        push: false
        tags: mail:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/zig

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Zig
      uses: mlugg/setup-zig@v2
      with:
        version: 0.16.0

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2

    - name: Check formatting
      run: zig fmt --check src/

    - name: Static analysis (future)
      run: echo "Static analysis placeholder"

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/zig

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Setup Zig
      uses: mlugg/setup-zig@v2
      with:
        version: 0.16.0

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2

    - name: Setup Pantry
      uses: home-lang/pantry/packages/action@main

    - name: Install dependencies
      working-directory: ${{ github.workspace }}
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev binutils-dev libdw-dev

    - name: Install kcov from source
      working-directory: ${{ github.workspace }}
      run: |
        KCOV_VERSION=42
        wget -q https://github.com/SimonKagstrom/kcov/releases/download/v${KCOV_VERSION}/kcov-amd64.tar.gz
        tar xzf kcov-amd64.tar.gz
        sudo cp usr/local/bin/kcov /usr/local/bin/
        rm -rf usr kcov-amd64.tar.gz

    - name: Build with debug info
      run: zig build -Doptimize=Debug

    - name: Run tests with coverage
      run: |
        mkdir -p coverage
        kcov --include-pattern=src/ coverage/ zig build test 2>/dev/null || true

    - name: Generate coverage report
      run: |
        if [ -d "coverage" ]; then
          echo "Coverage report generated"
          ls -la coverage/
        fi

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        directory: ./packages/zig/coverage
        fail_ci_if_error: false
        verbose: true

  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: packages/zig

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Setup Zig
      uses: mlugg/setup-zig@v2
      with:
        version: 0.16.0

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2

    - name: Setup Pantry
      uses: home-lang/pantry/packages/action@main

    - name: Install dependencies
      working-directory: ${{ github.workspace }}
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev

    - name: Build release
      run: zig build -Doptimize=ReleaseFast

    - name: Run benchmarks
      run: |
        if [ -f "zig-out/bin/benchmark" ]; then
          ./zig-out/bin/benchmark --json > benchmark-results.json
        else
          echo '{"note": "benchmark binary not found"}' > benchmark-results.json
        fi

    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: packages/zig/benchmark-results.json
