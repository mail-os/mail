name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: packages/zig

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Setup project dependencies with Pantry
      uses: pantry-pm/pantry/packages/action@v0.11.28

    - name: Install workspace dependencies
      working-directory: .
      run: bun install --frozen-lockfile

    - name: Build
      run: zig build -Doptimize=ReleaseSafe

    - name: Verify native SMTP readiness and exposition
      timeout-minutes: 2
      run: python3 ../../scripts/test-smtp-monitoring.py zig-out/bin/mail

    - name: Install browser engines
      if: runner.os == 'Linux'
      working-directory: .
      run: bun run playwright install --with-deps chromium firefox webkit

    - name: Verify cloud deployment templates
      if: runner.os == 'Linux'
      working-directory: .
      run: bun test packages/cloud/test

    - name: Verify Mail delivery status in the browser
      if: runner.os == 'Linux'
      working-directory: .
      timeout-minutes: 2
      run: python3 scripts/test-webmail-status.py packages/zig/zig-out/bin/mail webmail-browser-screenshots/mail-delivery

    - name: Run native HTTPS browser journeys
      if: runner.os == 'Linux'
      working-directory: .
      # All three engines must finish delivery verification and fixture teardown.
      timeout-minutes: 12
      run: python3 scripts/test-webmail-browser.py packages/zig/zig-out/bin/mail webmail-browser-screenshots

    - name: Verify external From in the browser
      if: runner.os == 'Linux'
      working-directory: .
      timeout-minutes: 2
      run: python3 scripts/test-webmail-external-senders.py packages/zig/zig-out/bin/mail --browser chromium --screenshots webmail-browser-screenshots

    - name: Audit native webmail accessibility
      if: runner.os == 'Linux'
      working-directory: .
      timeout-minutes: 6
      run: python3 scripts/test-webmail-browser.py packages/zig/zig-out/bin/mail webmail-browser-screenshots/accessibility --accessibility

    - name: Verify paid team invitations in the browser
      if: runner.os == 'Linux'
      working-directory: .
      timeout-minutes: 2
      run: python3 scripts/test-webmail-team-invitations.py packages/zig/zig-out/bin/mail --browser chromium --screenshots webmail-browser-screenshots

    - name: Verify app password management in the browser
      if: runner.os == 'Linux'
      working-directory: .
      timeout-minutes: 2
      run: python3 scripts/test-client-passwords.py packages/zig/zig-out/bin/mail --browser chromium --screenshots webmail-browser-screenshots

    - name: Verify webmail two-step verification in the browser
      if: runner.os == 'Linux'
      working-directory: .
      timeout-minutes: 5
      run: python3 scripts/test-webmail-mfa.py packages/zig/zig-out/bin/mail --browser chromium --browser webkit

    - name: Verify self-hosted mailbox management in the browser
      if: runner.os == 'Linux'
      working-directory: .
      timeout-minutes: 3
      run: python3 scripts/test-webmail-mailbox-operator.py packages/zig/zig-out/bin/mail --browser chromium --browser firefox --browser webkit --screenshots webmail-browser-screenshots

    - name: Record native webmail navigation baseline
      if: runner.os == 'Linux'
      working-directory: .
      timeout-minutes: 5
      run: python3 scripts/test-webmail-navigation.py packages/zig/zig-out/bin/mail webmail-browser-screenshots/navigation --revision "$(git rev-parse HEAD)"

    - name: Verify native Calendar day timeline
      if: runner.os == 'Linux'
      working-directory: .
      timeout-minutes: 7
      run: python3 scripts/test-webmail-day-timeline.py packages/zig/zig-out/bin/mail webmail-browser-screenshots/day-timeline

    - name: Verify continuous reading in the browser
      if: runner.os == 'Linux'
      working-directory: .
      timeout-minutes: 6
      run: python3 scripts/test-webmail-reading-view.py packages/zig/zig-out/bin/mail webmail-browser-screenshots/reading-view

    - name: Upload browser screenshots
      if: ${{ !cancelled() && runner.os == 'Linux' }}
      uses: actions/upload-artifact@v4
      with:
        name: webmail-browser-screenshots
        path: webmail-browser-screenshots/
        if-no-files-found: ignore

    - name: Run tests
      run: zig build test

    - name: Verify native archive and Restic recovery
      if: runner.os == 'Linux'
      run: |
        sudo apt-get install -y --no-install-recommends restic sqlite3
        python3 ../../scripts/test-mail-backup-restore.py zig-out/bin/mail

    # tests/ sat at the repo root after packages/zig was split out, where
    # build.zig could not reach it, so these suites went unrun (and rotted)
    # for months. Running them here keeps that from happening again.
    - name: Run RFC compliance tests
      run: zig build test-rfc

    - name: Run fuzz tests
      run: zig build test-fuzz

    # The real binary over TCP. Trap mode (SMTP_CATCH_ALL) files every
    # recipient into one mailbox, so the tests need no user database; auth is
    # on so AUTH gets a real 535 rather than 502. One throwaway account in the
    # throwaway database lets the AUTH tests log in for real (235), in every
    # form clients use. Without MAIL_E2E_SMTP the suite skips, so a server
    # that fails to start fails the step instead.
    - name: Run end-to-end tests against a live server
      run: |
        set -euo pipefail
        dir=$(mktemp -d)
        export MAIL_E2E_USER=e2e@example.com
        MAIL_E2E_PASSWORD=$(openssl rand -hex 16)
        export MAIL_E2E_PASSWORD
        (cd "$dir" && SMTP_DB_PATH="$dir/smtp.db" "$GITHUB_WORKSPACE/packages/zig/zig-out/bin/mail" \
          user:local create "$MAIL_E2E_USER" "$MAIL_E2E_PASSWORD" "$MAIL_E2E_USER" > /dev/null)
        (cd "$dir" && env SMTP_HOSTNAME=mail.example.com SMTP_CATCH_ALL=true \
          SMTP_ANTISPAM_CHECK=false SMTP_SPAM_FILTER=false \
          IMAP_ENABLED=false CALDAV_ENABLED=false SUBMISSION_PORT=25870 \
          SMTP_DB_PATH="$dir/smtp.db" \
          "$GITHUB_WORKSPACE/packages/zig/zig-out/bin/mail" serve \
            --host 127.0.0.1 --port 25825 --disable-tls --enable-auth \
            > "$dir/server.log" 2>&1 &)
        for _ in $(seq 1 50); do nc -z 127.0.0.1 25825 && break; sleep 0.2; done
        MAIL_E2E_SMTP=127.0.0.1:25825 zig build test-e2e --summary all || { cat "$dir/server.log"; exit 1; }

    - name: Run live webmail, CalDAV, and ownership migration tests
      run: |
        python3 ../../scripts/test-webmail.py zig-out/bin/mail
        python3 ../../scripts/test-message-refs.py zig-out/bin/mail
        python3 ../../scripts/test-local-routing.py zig-out/bin/mail
        python3 ../../scripts/test-sender-review.py zig-out/bin/mail
        python3 ../../scripts/test-mail-categories.py zig-out/bin/mail
        python3 ../../scripts/test-mail-attention.py zig-out/bin/mail
        python3 ../../scripts/test-mail-notifications.py zig-out/bin/mail
        python3 ../../scripts/test-webmail-index.py zig-out/bin/mail
        python3 ../../scripts/test-webmail-private.py zig-out/bin/mail
        python3 ../../scripts/test-webmail-teams.py zig-out/bin/mail
        python3 ../../scripts/test-webmail-team-invitations.py zig-out/bin/mail
        python3 ../../scripts/test-hosted-sign-in.py zig-out/bin/mail
        python3 ../../scripts/test-webmail-mfa.py zig-out/bin/mail
        python3 ../../scripts/test-client-passwords.py zig-out/bin/mail
        python3 ../../scripts/test-webmail-team-threads.py zig-out/bin/mail
        python3 ../../scripts/test-webmail-shared-inbox.py zig-out/bin/mail
        python3 ../../scripts/test-webmail-shared-replies.py zig-out/bin/mail
        python3 ../../scripts/test-webmail-contacts.py zig-out/bin/mail
        python3 ../../scripts/test-webmail-calendar-shares.py zig-out/bin/mail
        python3 ../../scripts/test-webmail-calendar-day-labels.py zig-out/bin/mail
        python3 ../../scripts/test-webmail-calendar-free-time.py zig-out/bin/mail
        python3 ../../scripts/test-webmail-calendar-tasks.py zig-out/bin/mail
        python3 ../../scripts/test-webmail-calendar-tools.py zig-out/bin/mail
        python3 ../../scripts/test-webmail-snapshot-links.py zig-out/bin/mail
        python3 ../../scripts/test-webmail-file-links.py zig-out/bin/mail
        python3 ../../scripts/test-webmail-batch-replies.py zig-out/bin/mail
        python3 ../../scripts/test-webmail-combined.py zig-out/bin/mail
        python3 ../../scripts/test-mailbox-export.py zig-out/bin/mail
        python3 ../../scripts/test-mail-import.py zig-out/bin/mail
        python3 ../../scripts/test-hosted-cutover.py zig-out/bin/mail
        python3 ../../scripts/test-hosted-domain-inventory.py zig-out/bin/mail
        python3 ../../scripts/test-hosted-domain-retirement.py zig-out/bin/mail
        python3 ../../scripts/test-imap-internaldate.py zig-out/bin/mail
        python3 ../../scripts/test-imap-bodystructure.py zig-out/bin/mail
        python3 ../../scripts/test-imap-keywords.py zig-out/bin/mail
        python3 ../../scripts/test-imap-folder-renames.py zig-out/bin/mail
        python3 ../../scripts/test-imap-index-search.py zig-out/bin/mail
        python3 ../../scripts/test-imap-move-index.py zig-out/bin/mail
        python3 ../../scripts/test-webmail-forwarding.py zig-out/bin/mail
        python3 ../../scripts/test-webmail-retention.py zig-out/bin/mail
        python3 ../../scripts/test-webmail-assistant-grants.py zig-out/bin/mail
        python3 ../../scripts/test-webmail-vacation.py zig-out/bin/mail
        python3 ../../scripts/test-webmail-junk.py zig-out/bin/mail
        python3 ../../scripts/test-dav-ownership.py
        python3 ../../scripts/test-dav-https.py zig-out/bin/mail
        python3 ../../scripts/test-ews-attachment-lifecycle.py zig-out/bin/mail
        python3 ../../scripts/test-ews-sync.py zig-out/bin/mail

    - name: Verify hosted storage and sending limits
      run: |
        python3 ../../scripts/test-hosted-limits.py zig-out/bin/mail
        python3 ../../scripts/test-hosted-limits.py --staging zig-out/bin/mail
        python3 ../../scripts/test-hosted-storage-alerts.py zig-out/bin/mail
        python3 ../../scripts/test-hosted-access.py zig-out/bin/mail
        python3 ../../scripts/test-hosted-domains.py zig-out/bin/mail
        python3 ../../scripts/test-hosted-staging.py --fixture zig-out/bin/mail
        python3 ../../scripts/test-hosted-operator.py zig-out/bin/mail
        python3 ../../scripts/test-hosted-erasure-export.py zig-out/bin/mail
        python3 ../../scripts/test-hosted-erasure-maildir.py zig-out/bin/mail
        python3 ../../scripts/test-hosted-erasure-search.py zig-out/bin/mail
        python3 ../../scripts/test-hosted-erasure-dav.py zig-out/bin/mail
        python3 ../../scripts/test-hosted-erasure-sqlite.py zig-out/bin/mail
        python3 ../../scripts/test-hosted-erasure-links.py zig-out/bin/mail
        python3 ../../scripts/test-hosted-erasure-shared-release.py zig-out/bin/mail
        python3 ../../scripts/test-hosted-erasure-inventory.py zig-out/bin/mail
        python3 ../../scripts/test-webmail-storage.py zig-out/bin/mail
        python3 ../../scripts/test-webmail-outbox-recovery.py zig-out/bin/mail
        python3 ../../scripts/test-webmail-scheduled-send.py zig-out/bin/mail
        python3 ../../scripts/test-webmail-writing-tools.py zig-out/bin/mail
        python3 ../../scripts/test-webmail-sender-identities.py zig-out/bin/mail
        python3 ../../scripts/test-webmail-external-senders.py zig-out/bin/mail
        python3 ../../scripts/test-webmail-outbox-pages.py zig-out/bin/mail
        python3 ../../scripts/test-eas-search.py zig-out/bin/mail
        python3 ../../scripts/test-eas-calendar-compose.py zig-out/bin/mail
        python3 ../../scripts/test-eas-calendar-sync.py zig-out/bin/mail
        python3 ../../scripts/test-eas-sync-state.py zig-out/bin/mail
        python3 ../../scripts/test-eas-move-items.py zig-out/bin/mail
        python3 ../../scripts/test-eas-folder-hierarchy.py zig-out/bin/mail
        python3 ../../scripts/test-local-maildir-upgrade.py zig-out/bin/mail

    - name: Verify hosted erasure against real Typesense
      if: runner.os == 'Linux'
      working-directory: .
      timeout-minutes: 4
      run: |
        archive="$RUNNER_TEMP/typesense-30.2.tar.gz"
        fixture="$RUNNER_TEMP/mail-typesense"
        mkdir -p "$fixture"
        curl --fail --silent --show-error --retry 3 --location --output "$archive" https://dl.typesense.org/releases/30.2/typesense-server-30.2-linux-amd64.tar.gz
        printf '%s  %s\n' cd791605e7c6cc7be457794f534cd4b9f9d361781adb10e40020efc22840ebc3 "$archive" | sha256sum --check
        tar -xzf "$archive" -C "$fixture" typesense-server
        python3 scripts/test-hosted-erasure-typesense.py packages/zig/zig-out/bin/mail --typesense-server "$fixture/typesense-server"

    - name: Verify outbound DKIM configuration and signing
      run: python3 ../../scripts/test-outbound-dkim.py zig-out/bin/mail

    - name: Verify user CLI password input and rotation
      run: |
        python3 ../../scripts/test-user-cli.py zig-out/bin/mail
        python3 ../../scripts/test-remote-user-cli.py zig-out/bin/mail

    - name: Verify malware scanning across mail and client intake
      run: |
        python3 ../../scripts/test-smtp-clamav.py zig-out/bin/mail
        python3 ../../scripts/test-client-intake-clamav.py zig-out/bin/mail
        python3 ../../scripts/test-ews-clamav.py zig-out/bin/mail

    - name: Verify health alerts, authenticated sync, and encrypted SMTP receipt
      run: |
        python3 ../../scripts/test-mail-health-watch.py
        python3 ../../scripts/test-mail-delivery-alerts.py zig-out/bin/mail
        python3 ../../scripts/test-mail-sync-health.py zig-out/bin/mail
        python3 ../../scripts/test-mail-tls.py zig-out/bin/mail

    - name: Check formatting
      run: zig fmt --check src/

  sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup project dependencies with Pantry
      uses: pantry-pm/pantry/packages/action@v0.11.28

    - name: Install workspace dependencies
      run: bun install --frozen-lockfile

    - name: Typecheck webmail
      run: bun run --filter mail-webmail typecheck

    # Covers the MIME parser: its own behaviour suite plus the parity suites that
    # compare it against postal-mime on well formed, malformed and mutated messages.
    - name: Run SDK tests
      working-directory: packages/ts
      run: bun test

    - name: Lint
      run: bunx --bun pickier packages/ts

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup project dependencies with Pantry
      uses: pantry-pm/pantry/packages/action@v0.11.28

    - name: Install workspace dependencies
      run: bun install --frozen-lockfile

    # The Docker context is packages/zig only and webmail_dist is gitignored,
    # so render the webmail bundle on the runner first; the image build then
    # embeds the pre-rendered dist (no bun inside the image).
    - name: Build webmail bundle
      working-directory: packages/webmail
      run: bun run build

    # The image installs Zig itself, and its build context is packages/zig only,
    # so the Dockerfile cannot read pantry.jsonc and carries its own copy of the
    # pin. That copy went stale unnoticed — every other job moved to
    # 0.17.0-dev.2033 while the image kept asking ziglang.org for a build it had
    # already garbage-collected, and the only symptom was a 404 deep in a log.
    # Compare them here so a repin that misses the Dockerfile fails on the
    # mismatch rather than on whatever breaks weeks later.
    - name: Check the Dockerfile's Zig pin matches pantry.jsonc
      run: |
        set -euo pipefail
        pinned=$(grep -oE '"ziglang\.org"[[:space:]]*:[[:space:]]*"[^"]+"' pantry.jsonc \
          | head -1 | sed -E 's/.*:[[:space:]]*"([^"]+)"/\1/')
        dockerfile=$(grep -oE '^ARG ZIG_VERSION=.*' packages/zig/Dockerfile \
          | head -1 | cut -d= -f2-)
        if [ -z "$pinned" ] || [ -z "$dockerfile" ]; then
          echo "::error::could not read the Zig pin (pantry.jsonc='$pinned', Dockerfile='$dockerfile')"
          exit 1
        fi
        if [ "$pinned" != "$dockerfile" ]; then
          echo "::error::Zig pin drift: pantry.jsonc says '$pinned', packages/zig/Dockerfile says '$dockerfile'."
          echo "::error::Update ARG ZIG_VERSION and ARG ZIG_SHA256 in packages/zig/Dockerfile to match."
          exit 1
        fi
        echo "Zig pin matches on both sides: $pinned"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./packages/zig
        push: false
        load: true
        tags: mail:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Verify the Alpine Mail daemon and its SMTP health check
      timeout-minutes: 2
      shell: bash
      run: |
        set -euo pipefail
        container=$(docker run --detach --network none mail:test)
        trap 'docker logs "$container"; docker rm -f "$container"' EXIT
        for _ in $(seq 1 50); do
          [[ $(docker inspect --format '{{.State.Running}}' "$container") == true ]] || exit 1
          if [[ $(docker inspect --format '{{.State.Health.Status}}' "$container") == healthy ]]; then
            docker exec "$container" sh -ec 'test "$PWD" = /var/mail && test -d /var/mail/mail && test -s /var/mail/users.db'
            exit 0
          fi
          sleep 1
        done
        exit 1

    - name: Verify Compose monitoring follows the active Mail daemon
      timeout-minutes: 5
      env:
        MAIL_IMAGE: mail:test
      run: python3 scripts/test-compose-monitoring.py

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/zig

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup project dependencies with Pantry
      uses: pantry-pm/pantry/packages/action@v0.11.28

    - name: Test incident state and alert retry behavior
      run: python3 ../../scripts/test-mail-health-watch.py

    - name: Check formatting
      run: zig fmt --check src/

    - name: Install workspace dependencies
      working-directory: ${{ github.workspace }}
      run: bun install --frozen-lockfile

    # Guards the release flow: the preflight suite asserts every manifest bumpx
    # rewrites is still on the same version, so drift fails a PR instead of
    # silently shipping a stale package at release time.
    - name: Test release scripts
      working-directory: ${{ github.workspace }}
      run: bun test scripts packages/webmail

    - name: Static analysis (future)
      run: echo "Static analysis placeholder"

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/zig

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Setup project dependencies with Pantry
      uses: pantry-pm/pantry/packages/action@v0.11.28

    - name: Install coverage dependencies
      working-directory: ${{ github.workspace }}
      run: |
        sudo apt-get update
        sudo apt-get install -y binutils-dev libdw-dev

    - name: Install kcov from source
      working-directory: ${{ github.workspace }}
      run: |
        KCOV_VERSION=42
        wget -q https://github.com/SimonKagstrom/kcov/releases/download/v${KCOV_VERSION}/kcov-amd64.tar.gz
        tar xzf kcov-amd64.tar.gz
        sudo cp usr/local/bin/kcov /usr/local/bin/
        rm -rf usr kcov-amd64.tar.gz

    - name: Install workspace dependencies
      working-directory: .
      run: bun install --frozen-lockfile

    - name: Build with debug info
      run: zig build -Doptimize=Debug

    - name: Run tests with coverage
      run: |
        mkdir -p coverage
        kcov --include-pattern=src/ coverage/ zig build test 2>/dev/null || true

    - name: Generate coverage report
      run: |
        if [ -d "coverage" ]; then
          echo "Coverage report generated"
          ls -la coverage/
        fi

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        directory: ./packages/zig/coverage
        fail_ci_if_error: false
        verbose: true

  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: packages/zig

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Setup project dependencies with Pantry
      uses: pantry-pm/pantry/packages/action@v0.11.28

    - name: Install workspace dependencies
      working-directory: .
      run: bun install --frozen-lockfile

    - name: Build release
      run: zig build -Doptimize=ReleaseFast

    - name: Run benchmarks
      run: |
        if [ -f "zig-out/bin/benchmark" ]; then
          ./zig-out/bin/benchmark --json > benchmark-results.json
        else
          echo '{"note": "benchmark binary not found"}' > benchmark-results.json
        fi

    - name: Verify indexed webmail latency
      timeout-minutes: 10
      run: python3 ../../scripts/benchmark-webmail-search.py zig-out/bin/mail --revision "$GITHUB_SHA" --output webmail-search-results.json --enforce

    - name: Upload benchmark results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: |
          packages/zig/benchmark-results.json
          packages/zig/webmail-search-results.json
